apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: microservices_lab2-bff:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVICES_AUTH_URL
              value: http://authservice:9000
            - name: SERVICES_USER_URL
              value: http://userservice:8083
            - name: SERVICES_MESSAGE_URL
              value: http://messageservice:8082
---
apiVersion: v1
kind: Service
metadata:
  name: bff
spec:
  type: NodePort
  selector:
    app: bff
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080